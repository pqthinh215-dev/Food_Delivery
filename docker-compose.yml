services:
  # Database Service (MySQL 8.0)
  mysql:
    image: mysql:8.0
    container_name: nestjs_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-123456}
      MYSQL_DATABASE: ${DATABASE_NAME:-bt_sql}
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DATABASE_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  # Backend API Service (NestJS)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs_api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-123456}
      DATABASE_NAME: ${DATABASE_NAME:-bt_sql}
      DATABASE_URL: mysql://root:${DATABASE_PASSWORD:-123456}@mysql:3306/${DATABASE_NAME:-bt_sql}
      JWT_SECRET: ${JWT_SECRET:-It0DrLyPx4lRfYrRZJmpiv5XhtMXLsMFt7pmmNaqGCW}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
